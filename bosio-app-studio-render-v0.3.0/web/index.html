<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSIO APP STUDIO ULTIMATE</title><link rel="stylesheet" href="/web/styles.css"></head><body><header><div><h1>BOSIO APP STUDIO <span>ULTIMATE</span></h1><p>Creacion autonoma de aplicaciones</p></div><div id="health" class="health">Verificando...</div></header><main><section class="panel"><h2>Nuevo proyecto</h2><form id="f"><label>Nombre</label><input id="name" required placeholder="Mi negocio"><label>Que aplicacion queres crear?</label><textarea id="prompt" rows="4" required placeholder="Creá un sistema de gestion con clientes, productos, stock y ventas"></textarea><button>Crear proyecto</button></form><div id="msg" class="message" hidden></div></section><section class="panel"><h2>Proyectos</h2><div id="projects"><p class="muted">Cargando...</p></div></section><section class="panel" id="detail" hidden><h2 id="title">Proyecto</h2><div class="actions"><button id="run">Ejecutar pipeline</button><button id="refresh">Actualizar</button><button id="export">Exportar JSON</button></div><div class="grid"><div><h3>Tareas</h3><ul id="tasks"></ul></div><div><h3>Archivos</h3><ul id="files"></ul></div></div><h3>Vista previa</h3><iframe id="preview"></iframe><pre id="out" class="code" hidden></pre></section></main><script src="/web/app.js"></script></body></html>
