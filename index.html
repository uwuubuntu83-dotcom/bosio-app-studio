<style>

(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);

/* ---------- reglas para el modelo ---------- */
const RULES=`Sos Forja, un constructor experto de aplicaciones web, juegos y páginas. Construís lo que pide la persona y tiene que funcionar apenas se abre.

REGLAS TÉCNICAS
- Apps chicas o medianas: un solo archivo index.html con CSS y JS adentro. Apps grandes (más de ~400 líneas): index.html + styles.css + app.js (y otros .js si hace falta), enlazados con <link rel="stylesheet" href="styles.css"> y <script src="app.js"></${SC}>. Scripts clásicos: nada de import/export entre archivos propios.

- Sin servidor propio: nada de fetch a APIs inventadas. Si necesita datos, incluí datos de ejemplo realistas. Para guardar en el dispositivo usá localStorage dentro de try/catch, con respaldo en memoria.
- Prohibido alert(), confirm() y prompt(): hacé diálogos dentro de la página.
- Funcional y completo: sin "TODO", sin funciones vacías, sin lorem ipsum. Contenido real en español rioplatense salvo que pidan otro idioma.
- Responsive desde 360px, controles táctiles y de teclado, foco visible, respetar prefers-reduced-motion.
- Juegos: canvas o DOM con requestAnimationFrame, controles táctiles en pantalla además de teclado, iniciar/pausa/reiniciar, puntaje y récord guardado.
- Imágenes e íconos: dibujalos con SVG en línea o CSS. No uses emojis como íconos.
- Si te pasan una captura de otra app: reproducí estructura, flujos y distribución con nombre, textos, colores y logo propios (nunca la marca original).

DISEÑO
- Paleta y tipografía elegidas para el tema concreto, como variables CSS. Una panadería no se ve como un panel financiero.
- Evitá el look genérico de IA: degradados violeta-azul, fondo crema con acento terracota, negro con un solo verde ácido, todo en tarjetas iguales con la misma sombra, etiquetas en mayúsculas sobre cada título.
- Jerarquía tipográfica clara, espaciado con gap, una sola animación con sentido en vez de muchas.`;

async function readSSE(res,onData,signal){
  const rd=res.body.getReader();const dec=new TextDecoder();let buf="";
  while(true){if(signal&&signal.aborted)throw{code:"cancelled"};const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(!d||d==="[DONE]")continue;let j;try{j=JSON.parse(d)}catch(e){continue}onData(j)}}
}
async function httpErr(res,eng){let t="";try{t=await res.text()}catch(e){}let m=t;try{const j=JSON.parse(t);m=(j.error&&(j.error.message||j.error))||j.message||t}catch(e){}
  const why=res.status===401||res.status===403?"La clave no es válida o no tiene permiso.":res.status===429?"Se llegó al límite gratis de este modelo por ahora. Esperá un minuto o elegí otro modelo gratis en Ajustes.":res.status===404?"El modelo no existe con ese nombre. Elegí otro en Ajustes.":res.status===402?"Ese modelo requiere saldo. Elegí uno gratis en Ajustes.":"El proveedor respondió con un error.";
  return{code:"http",status:res.status,message:why+" ("+res.status+") "+String(m).slice(0,220)}}
function b64(blob){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(blob)})}

async function callAI(turns,{onText,signal,images,quick}={}){
  const eng=settings.engine;let text="",truncated=false;
  const emit=d=>{if(!d)return;text+=d;onText&&onText(text)};
  usage.calls++;usage.chars+=turns.reduce((a,t)=>a+t.content.length,0);
  if(eng==="claude"){
    if(!sampleFn)throw{code:"no_engine",message:"Claude solo funciona cuando abrís Forja dentro de Claude. Elegí otro motor en Ajustes."};
    const opt={onText:({text:t})=>{text=t;onText&&onText(t)},signal,cache:false,modelTier:quick?"quick":(settings.tier||"default")};
    if(images&&images.length){if(!sampleLimits||!sampleLimits.images)throw{code:"images_unavailable",message:"Esta vista no permite mandar imágenes a Claude. Describí la captura con palabras."};opt.images=images.map(a=>a.blob)}
    const r=await sampleFn(turns,opt);return{text:r.text,truncated:r.truncated};
  }
  if(!WEB)throw{code:"no_net",message:"Dentro de Claude, Forja no puede conectarse a "+ENGINES[eng]+". Usá el motor Claude o abrí Forja en la web."};
  const key=settings.keys[eng]||"";const model=(settings.models[eng]||"").trim();
  if(eng!=="openai"&&!key)throw{code:"no_key",message:"Falta la clave de "+ENGINES[eng]+". Cargala en Ajustes."};
  if(!model)throw{code:"no_model",message:"Falta elegir el modelo de "+ENGINES[eng]+". Elegilo en Ajustes."};
  const imgs=[];for(const a of images||[])imgs.push({mime:a.blob.type||"image/png",data:await b64(a.blob)});
  let res;
  try{
    if(eng==="gemini"){
      const contents=turns.map((t,i)=>({role:t.role==="assistant"?"model":"user",parts:[{text:t.content}].concat(i===turns.length-1?imgs.map(x=>({inline_data:{mime_type:x.mime,data:x.data}})):[])}));
      res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model.replace(/^models\//,""))+":streamGenerateContent?alt=sse&key="+encodeURIComponent(key),{method:"POST",signal,headers:{"content-type":"application/json"},body:JSON.stringify({contents,generationConfig:{maxOutputTokens:65536,temperature:0.6}})});
      if(!res.ok)throw await httpErr(res,eng);
      await readSSE(res,j=>{if(j.error)throw{code:"http",message:j.error.message||"Error de Gemini"};const c=j.candidates&&j.candidates[0];if(!c)return;for(const p of(c.content&&c.content.parts)||[])if(p.text&&!p.thought)emit(p.text);if(c.finishReason==="MAX_TOKENS")truncated=true},signal);
    }else if(eng==="anthropic"){
      const messages=turns.map((t,i)=>({role:t.role,content:i===turns.length-1&&imgs.length?imgs.map(x=>({type:"image",source:{type:"base64",media_type:x.mime,data:x.data}})).concat([{type:"text",text:t.content}]):t.content}));
      res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:32000,stream:true,messages})});
      if(!res.ok)throw await httpErr(res,eng);
      await readSSE(res,j=>{if(j.type==="content_block_delta"&&j.delta&&j.delta.type==="text_delta")emit(j.delta.text);if(j.type==="message_delta"&&j.delta&&j.delta.stop_reason==="max_tokens")truncated=true;if(j.type==="error")throw{code:"http",message:(j.error&&j.error.message)||"Error del proveedor"}},signal);
    }else{
      const base=eng==="openrouter"?"https://openrouter.ai/api/v1":(settings.baseUrl||"").replace(/\/+$/,"");
      const messages=turns.map((t,i)=>({role:t.role,content:i===turns.length-1&&imgs.length?[{type:"text",text:t.content}].concat(imgs.map(x=>({type:"image_url",image_url:{url:"data:"+x.mime+";base64,"+x.data}}))):t.content}));
      const headers={"content-type":"application/json"};if(key)headers.authorization="Bearer "+key;if(eng==="openrouter")headers["X-Title"]="Forja";
      res=await fetch(base+"/chat/completions",{method:"POST",signal,headers,body:JSON.stringify({model,stream:true,messages})});
      if(!res.ok)throw await httpErr(res,eng);
      await readSSE(res,j=>{if(j.error)throw{code:"http",message:j.error.message||"Error del proveedor"};const c=j.choices&&j.choices[0];if(!c)return;if(c.delta&&c.delta.content)emit(c.delta.content);if(c.finish_reason==="length")truncated=true},signal);
    }
  }catch(e){
    if(e&&e.name==="AbortError")throw{code:"cancelled",text};
    if(e&&e.code)throw Object.assign({text},e);
    throw{code:"network",text,message:"No se pudo conectar con "+ENGINES[eng]+". Revisá tu conexión a internet y probá de nuevo."};
  }
  if(!text.trim())throw{code:"empty_completion",message:"El modelo no devolvió texto. Probá de nuevo o con otro modelo."};
  return{text,truncated};
}

/* ---------- interpretar respuestas ---------- */
const EDIT_RE=/<<<<<<< BUSCAR[ \t]*([^\n]*)\r?\n([\s\S]*?)\r?\n=======\r?\n([\s\S]*?)\r?\n?>>>>>>> REEMPLAZAR/g;
const DEF_NAME={html:"index.html",css:"styles.css",js:"app.js",javascript:"app.js",sql:"supabase.sql",json:"data.json"};
function parseAnswer(t){
  const edits=[];let m;EDIT_RE.lastIndex=0;
  while((m=EDIT_RE.exec(t)))edits.push({file:m[1].trim().replace(/^["'`]|["'`]$/g,"")||null,find:m[2],repl:m[3]});
  const stripped=t.replace(EDIT_RE,s=>"\u0000".repeat(s.length));
  const files=[];const fre=/```([\w+#.-]*)[ \t]*([^\n`]*)\n/g;let f;let lastEnd=0;
  while((f=fre.exec(stripped))){
    const lang=(f[1]||"").toLowerCase();let name=(f[2]||"").trim().replace(/^(file(name)?|archivo)\s*[:=]\s*/i,"").replace(/^["'`]|["'`]$/g,"");
    const start=f.index+f[0].length;let end=stripped.indexOf("\n```",start-1);if(end<start-1)end=-1;
    const content=end>=0?t.slice(start,end+1):t.slice(start);
    if(!name){if(DEF_NAME[lang])name=DEF_NAME[lang];else if(/^\s*<(!doctype|html)/i.test(content))name="index.html";}
    if(name&&/^[\w./-]+\.\w+$/.test(name)&&!/^(bash|sh|text|txt|plaintext)$/.test(lang))files.push({name:name.replace(/^\.\//,""),content:content.replace(/\s+$/,"")+"\n",open:end<0});
    lastEnd=end>=0?end+4:stripped.length;fre.lastIndex=lastEnd;if(end<0)break;
  }
  const deletes=[...t.matchAll(/BORRAR ARCHIVO:\s*([\w./-]+)/g)].map(x=>x[1]);
  const firsts=[t.indexOf("<<<<<<< BUSCAR"),t.search(/```[\w+#.-]*[ \t]*[^\n`]*\n/)].filter(i=>i>=0);
  const cut=firsts.length?Math.min(...firsts):-1;
  const expl=(cut>=0?t.slice(0,cut):t).replace(/BORRAR ARCHIVO:.*$/gm,"").trim();
  return{expl,files,edits,deletes,open:files.some(x=>x.open)};
}
function progressOf(t){const fs=[...t.matchAll(/```[\w+#.-]*[ \t]*([^\n`]*)\n/g)];const ne=(t.match(/<<<<<<< BUSCAR/g)||[]).length;
  if(fs.length){const lastF=fs[fs.length-1];return"Escribiendo "+(lastF[1].trim()||"el código")+" · "+lines(t.slice(lastF.index))+" líneas"}
  if(ne)return"Preparando "+ne+" cambio"+(ne>1?"s":"");return"Pensando"}
function applyEdit(code,e){
  const i=code.indexOf(e.find);
  if(i>=0&&e.find.length&&code.indexOf(e.find,i+1)<0)return{ok:true,code:code.slice(0,i)+e.repl+code.slice(i+e.find.length),n:Math.max(lines(e.find),lines(e.repl))};
  const L=code.split("\n"),F=e.find.split("\n").map(s=>s.trim());while(F.length&&!F[F.length-1])F.pop();while(F.length&&!F[0])F.shift();
  const hits=[];if(F.length)for(let a=0;a+F.length<=L.length;a++){let ok=true;for(let b=0;b<F.length;b++)if(L[a+b].trim()!==F[b]){ok=false;break}if(ok)hits.push(a)}
  if(hits.length===1){const a=hits[0];const ind=(L[a].match(/^\s*/)||[""])[0];const rl=e.repl.split("\n");const base=((rl.find(x=>x.trim())||"").match(/^\s*/)||[""])[0];
    const fixed=rl.map(x=>x.startsWith(base)?ind+x.slice(base.length):x);L.splice(a,F.length,...fixed);return{ok:true,code:L.join("\n"),n:Math.max(F.length,rl.length)}}
  return{ok:false,reason:hits.length>1?"aparece más de una vez":"no coincide con el código actual"};
}

function assemble(fs){
  const entry=entryOf(fs);if(!entry)return"";let html=fs[entry];

  b.append(h("div",{class:"group"},h("h3",{},"Todos tus proyectos"),h("div",{class:"row"},
      h("button",{class:"btn primary",onclick:()=>{const q=newProject("Proyecto nuevo");projects.push(q);curId=q.id;previewFiles=null;lastErrors=[];picked=null;curFile="index.html";persist();refreshAll();close();setMob("chat");const t=$("#prompt");t&&t.focus()}},"Nuevo proyecto"),
      h("button",{class:"btn",onclick:()=>saveFile("forja-proyectos-"+today+".json",JSON.stringify({app:"forja",v:2,projects},null,1),"application/json")},"Exportar copia"),
      h("button",{class:"btn",onclick:()=>imp.click()},"Importar"),imp),list,
    h("small",{class:"hint"},"Tus proyectos se guardan en este navegador. Exportá una copia de vez en cuando para no perderlos o para pasarlos a otra compu.")));
})}
$("#projBtn").addEventListener("click",openProjects);
function openSettings(){drawer("Ajustes",(b)=>{
  const opts=Object.entries(ENGINES).filter(([k])=>k!=="claude"||hasClaude);
  const sel=h("select",{id:"engSel"},...opts.map(([k,v])=>h("option",{value:k,selected:settings.engine===k},v)));
  const box=h("div",{style:"display:flex;flex-direction:column;gap:12px"});
  const fld=(id,label,el,small)=>h("div",{class:"field"},h("label",{for:id},label),el,small?h("small",{},small):null);
  const inp=(id,val,on,type,list)=>{const i=h("input",{id,type:type||"text",value:val||"",autocomplete:"off",spellcheck:"false",list:list||null});i.addEventListener("change",()=>{on(i.value.trim());persist();renderTop();renderComposer();renderMsgs()});return i};
  const st=h("div",{class:"hint","aria-live":"polite"});
  const modelPicker=(eng,loader,needKey)=>{const dl=h("datalist",{id:"dl-"+eng});const mi=inp("m-"+eng,settings.models[eng],v=>settings.models[eng]=v,"text","dl-"+eng);
    const lb=h("button",{class:"btn",onclick:async()=>{if(needKey&&!settings.keys[eng]){st.textContent="Primero pegá la clave.";return}st.textContent="Buscando modelos…";
      try{const ms=await loader();dl.innerHTML="";ms.slice(0,80).forEach(m=>dl.append(h("option",{value:m})));if(ms.length){if(!settings.models[eng]||!ms.includes(settings.models[eng])){settings.models[eng]=ms[0];mi.value=ms[0];persist();renderTop();renderComposer();renderMsgs()}st.textContent=ms.length+" modelos disponibles. Elegí uno de la lista o dejá el recomendado ("+ms[0]+")."}else st.textContent="No encontré modelos."}catch(e){st.textContent=(e&&e.message)||"No pude cargar la lista."}}},"Cargar modelos");
    return h("div",{class:"field"},h("label",{for:"m-"+eng},"Modelo"),h("div",{class:"row"},h("div",{style:"flex:1;min-width:160px"},mi),lb),dl)};
  const testB=h("button",{class:"btn",onclick:async()=>{st.textContent="Probando conexión…";try{const r=await callAI([{role:"user",content:"Respondé solo con la palabra: listo"}],{quick:true});usage.calls--;st.textContent="Funciona. El modelo respondió: "+r.text.trim().slice(0,40)}catch(e){st.textContent=errText(e)}}},"Probar conexión");
  const draw=()=>{box.innerHTML="";const e=settings.engine;
    if(!WEB&&e!=="claude")box.append(h("div",{class:"callout"},"Dentro de Claude esta página no puede conectarse a otros proveedores. Usá Forja en la web para este motor."));
    if(e==="claude"){
      box.append(h("p",{class:"hint"},"Usa tu cuenta de Claude, dentro del límite de uso de tu plan. La primera vez te pide permiso."));
      const t=h("select",{id:"tier"},...[["quick","Rápido (cambios chicos)"],["default","Normal (recomendado)"],["complex","Máximo (apps grandes, tarda más)"]].map(([k,v])=>h("option",{value:k,selected:settings.tier===k},v)));
      t.addEventListener("change",()=>{settings.tier=t.value;persist()});box.append(fld("tier","Potencia",t));
    }
    if(e==="gemini"){box.append(h("p",{class:"hint"},"Gratis con cupo diario. Sacá la clave en ",h("a",{href:"https://aistudio.google.com/apikey",target:"_blank",rel:"noopener"},"aistudio.google.com/apikey")," → Create API key."),
      fld("k-gemini","Clave de Gemini",inp("k-gemini",settings.keys.gemini,v=>settings.keys.gemini=v,"password")),modelPicker("gemini",()=>listGemini(settings.keys.gemini),true))}
    if(e==="openrouter"){box.append(h("p",{class:"hint"},"Una sola clave para muchos modelos. Los que terminan en :free no cobran (unos 200 pedidos por día). Clave en ",h("a",{href:"https://openrouter.ai/keys",target:"_blank",rel:"noopener"},"openrouter.ai/keys"),"."),
      fld("k-openrouter","Clave de OpenRouter",inp("k-openrouter",settings.keys.openrouter,v=>settings.keys.openrouter=v,"password")),modelPicker("openrouter",listOpenRouterFree,false))}
    if(e==="anthropic"){box.append(h("p",{class:"hint"},"Pagás directo a Anthropic por lo que uses, sin recargo. Clave en ",h("a",{href:"https://console.anthropic.com/settings/keys",target:"_blank",rel:"noopener"},"console.anthropic.com"),"."),
      fld("k-anthropic","Clave de Anthropic",inp("k-anthropic",settings.keys.anthropic,v=>settings.keys.anthropic=v,"password")),fld("m-anthropic","Modelo",inp("m-anthropic",settings.models.anthropic,v=>settings.models.anthropic=v),"Ej: claude-sonnet-5-5"))}
    if(e==="openai"){box.append(h("p",{class:"hint"},"Cualquier servicio compatible con OpenAI: OpenAI, Groq, Together, DeepSeek y otros."),
      fld("bURL","Dirección de la API",inp("bURL",settings.baseUrl,v=>settings.baseUrl=v),"Ej: https://api.groq.com/openai/v1"),fld("k-openai","Clave",inp("k-openai",settings.keys.openai,v=>settings.keys.openai=v,"password")),fld("m-openai","Modelo",inp("m-openai",settings.models.openai,v=>settings.models.openai=v)))}
    box.append(h("div",{class:"row"},testB),st);
    if(e!=="claude")box.append(h("small",{class:"hint"},"Las claves quedan guardadas solo en este navegador y se mandan únicamente al proveedor elegido."));
  };
  sel.addEventListener("change",()=>{settings.engine=sel.value;st.textContent="";persist();draw();renderTop();renderComposer();renderMsgs()});
  draw();
  b.append(h("div",{class:"group"},h("h3",{},"Motor de IA"),fld("engSel","Quién escribe el código",sel),box));
  const th=h("select",{id:"thSel"},...[["","Como el sistema"],["light","Claro"],["dark","Oscuro"]].map(([k,v])=>h("option",{value:k,selected:(store.get("theme","")===k)},v)));
  th.addEventListener("change",()=>{store.set("theme",th.value);applyTheme()});
  b.append(h("div",{class:"group"},h("h3",{},"Apariencia"),fld("thSel","Tema",th)));
  if(SELF_SRC)b.append(h("div",{class:"group"},h("h3",{},"Copia de Forja"),h("p",{class:"hint"},"Descargá Forja como archivo .html para tenerla de respaldo o abrirla con doble clic en cualquier navegador."),h("div",{},h("button",{class:"btn",onclick:()=>saveFile("forja.html",SELF_SRC,"text/html")},"Descargar Forja"))));
})}
$("#setBtn").addEventListener("click",openSettings);
$("#engineChip").addEventListener("click",openSettings);
function applyTheme(){const t=store.get("theme","");if(t)document.documentElement.setAttribute("data-theme",t);else if(!hasClaude)document.documentElement.removeAttribute("data-theme")}

function refreshAll(){renderTop();renderMsgs();renderComposer();renderWork()}
applyTheme();refreshAll();layoutTop();window.addEventListener("resize",layoutTop);
try{document.fonts&&document.fonts.ready.then(layoutTop)}catch(e){}setTimeout(layoutTop,600);
initClaude();
})();
</script>
